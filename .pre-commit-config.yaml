# .pre-commit-config.yaml
repos:
  # 1. 通用基础钩子
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0  # 请定期检查更新
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  # 2. Rust 代码格式化 (rustfmt)
  - repo: https://github.com/doublify/pre-commit-rust
    rev: v1.0
    hooks:
      - id: fmt
        args: [--all]
        pass_filenames: false

  # 3. 本地钩子
  - repo: local
    hooks:
      # Rust 基础检查 (cargo check) - 快速验证能否编译
      - id: cargo-check
        name: cargo check
        entry: cargo check --all-targets --all-features
        language: system
        types: [rust]
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # 自动生成第三方依赖许可证声明（THIRD-PARTY-NOTICES.md）
      - id: third-party-notices
        name: update THIRD-PARTY-NOTICES.md
        entry: bash -c 'cargo-about generate about.hbs > THIRD-PARTY-NOTICES.md && perl -0pi -e "s/\\n+\\z/\\n/" THIRD-PARTY-NOTICES.md'
        language: system
        files: (Cargo\.toml|Cargo\.lock)
        pass_filenames: false
        always_run: false
        stages: [pre-commit]
